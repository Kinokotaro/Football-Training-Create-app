<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Training Preview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Helvetica Neue', 'Helvetica', 'Arial', sans-serif;
            padding: 20px;
        }
        .session-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 20px;
            padding: 15px;
            background-color: #fff;
        }
        .session-card h5 {
            color: #0056b3;
            margin-bottom: 10px;
        }
        .session-card p {
            margin-bottom: 5px;
        }
        .preview-canvas-container {
            width: 100%;
            aspect-ratio: 800 / 520; /* Maintain aspect ratio */
            border: 1px solid #ccc;
            background-color: #f0f0f0;
            position: relative;
        }
        .preview-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/b/b9/Soccer_field_-_empty.svg/2000px-Soccer_field_-_empty.svg.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="mb-4">本日のトレーニングプレビュー (<span id="preview-date"></span>)</h2>
        <div id="daily-sessions-container" style="max-height: calc(100vh - 150px); overflow-y: auto;">
            <!-- Daily sessions will be loaded here by JavaScript -->
        </div>
        <button class="btn btn-secondary mt-4" onclick="window.close();">閉じる</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const previewDateElement = document.getElementById('preview-date');
            const dailySessionsContainer = document.getElementById('daily-sessions-container');

            const urlParams = new URLSearchParams(window.location.search);
            const selectedDate = urlParams.get('date');

            if (selectedDate) {
                previewDateElement.textContent = selectedDate;
                console.log('Preview: Selected Date =', selectedDate);
                const allSessions = JSON.parse(localStorage.getItem('trainingSessions') || '[]');
                console.log('Preview: All Sessions from localStorage =', allSessions);
                const sessionsForDate = allSessions.filter(session => session.date === selectedDate);
                console.log('Preview: Sessions for selected date =', sessionsForDate);

                if (sessionsForDate.length > 0) {
                    for (const session of sessionsForDate) { // Use for...of for async/await
                        console.log('Preview: Rendering session', session.id, session.name);
                        const sessionCard = document.createElement('div');
                        sessionCard.className = 'session-card';
                        sessionCard.innerHTML = `
                            <h5>${session.name || '無題のセッション'} (${session.time || '時間未定'})</h5>
                            <p><strong>狙い:</strong> ${session.objective || '未設定'}</p>
                            <p><strong>説明:</strong> ${session.description || '未設定'}</p>
                            <div class="preview-canvas-container">
                                <img src="${session.previewImage || ''}" alt="Training Canvas" style="width: 100%; height: auto; display: block;">
                            </div>
                        `;
                        dailySessionsContainer.appendChild(sessionCard);
                    }
                } else {
                    dailySessionsContainer.innerHTML = '<p>この日付のセッションはありません。</p>';
                }
            } else {
                dailySessionsContainer.innerHTML = '<p>プレビューする日付が指定されていません。</p>';
            }
        });
    </script>
</body>
</html>
